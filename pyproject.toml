[project]
name = "blog-generator"
version = "1.0.0"
description = "Generator for creating the Blog"
authors = [{name = "Patrik Hlobil", email = "patrik.hlobil@gmail.com"}]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.12.2,<5",
    "click>=8.1.3,<9",
    "pyyaml>=6.0,<7",
    "requests>=2.31,<3",
    "zensical>=0.0.62,<0.1",
]

[project.scripts]
add-link = "tools.add_link:add_link"

[dependency-groups]
dev = ["pre-commit>=4.0,<5"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tools"
module-root = ""


[tool.ruff]
select = [
    # Pyflakes
    "F",
    # Pycodestyle
    "E",
    "W",
    # isort
    "I001"
]

[tool.ruff.isort]
force-sort-within-sections = true
